name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev libpango1.0-dev libcairo2-dev glslang-tools
      - name: Python behavior tests
        run: python3 -m unittest discover -s tests -v
      - name: Syntax checks
        run: |
          python3 -m py_compile backend/*.py
          bash -n scripts/setup scripts/start-service scripts/tablet
          for shader in ui/shaders/*.frag; do glslangValidator "$shader"; done
      - name: Build keyboard
        run: make -C vendor/wvkbd LAYOUT=tablet wvkbd-tablet
